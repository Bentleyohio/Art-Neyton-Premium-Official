<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="tabTitle">Art Neyton Premium</title>
  <link id="tabFavicon" rel="icon" href="Logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Art Neyton Hub Styling */
    #artNeytonContent {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      background: #090814;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      padding: 40px 20px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .watermark-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeOutOverlay 0.8s ease 1.8s forwards;
      pointer-events: none;
    }

    .watermark-text {
      font-size: 2.5rem;
      font-weight: bold;
      color: #7b73ff;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #7b73ff, 0 0 30px #7b73ff;
      opacity: 0;
      transform: scale(0.8);
      animation: introGlow 1.6s ease-in-out forwards;
    }

    @keyframes introGlow {
      0% { opacity: 0; transform: scale(0.8) translateY(20px); filter: blur(10px); }
      50% { opacity: 1; transform: scale(1.05) translateY(0); filter: blur(0px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
    }

    @keyframes fadeOutOverlay {
      to { opacity: 0; visibility: hidden; }
    }

    .header-logo-container {
      margin-bottom: 25px;
      text-align: center;
    }

    .header-logo {
      max-width: 450px;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .card {
      background: rgba(18, 16, 38, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #231f47;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .nav-toggle-btn {
      width: calc(100% - 50px);
      padding: 12px;
      font-size: 1.05rem;
      font-weight: bold;
      color: #00f2fe;
      background-color: rgba(10, 22, 40, 0.8);
      border: 1px solid #00f2fe;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
    }

    .nav-toggle-btn:hover {
      background-color: rgba(0, 242, 254, 0.15);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }

    /* Page Slider Container */
    .view-slider {
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .view-track {
      display: flex;
      width: 100%;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .page-panel {
      min-width: 100%;
      box-sizing: border-box;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      width: 100%;
    }

    .launcher-btn {
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #ffffff;
      background-color: rgba(26, 24, 41, 0.9);
      border: 1px solid #2e2a4a;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 55px;
      box-sizing: border-box;
      width: 100%;
      text-align: center;
      text-decoration: none;
    }

    .launcher-btn img {
      max-height: 35px;
      max-width: 100%;
      object-fit: contain;
    }

    .launcher-btn:hover {
      background-color: rgba(39, 35, 61, 0.95);
      border-color: #433d6b;
      transform: translateY(-2px);
    }

    .utility-grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .utility-btn {
      padding: 20px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      background-color: rgba(15, 30, 54, 0.9);
      border: 2px solid #1d426d;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 95px;
      box-sizing: border-box;
      width: 100%;
      text-align: center;
      text-decoration: none;
    }

    .utility-btn img {
      max-height: 55px;
      max-width: 100%;
      object-fit: contain;
    }

    .utility-btn:hover {
      background-color: rgba(22, 45, 80, 0.95);
      border-color: #00f2fe;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
      transform: translateY(-2px);
    }

    /* Glowing Pagination Navigation Bar */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 5px;
    }

    .page-btn {
      background: rgba(26, 24, 41, 0.8);
      border: 1px solid #2e2a4a;
      color: #a1a1aa;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .page-btn:hover {
      color: #ffffff;
      border-color: #7b73ff;
      box-shadow: 0 0 10px rgba(123, 115, 255, 0.3);
    }

    .page-btn.active {
      color: #00f2fe;
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.1);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }

    .settings-icon {
      position: absolute;
      top: 18px;
      right: 20px;
      background: none;
      border: none;
      color: #71717a;
      font-size: 1.8rem;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
      padding: 5px;
      line-height: 1;
      z-index: 10;
    }

    .settings-icon:hover {
      color: #7b73ff;
      transform: rotate(30deg);
    }

    .settings-panel {
      display: none;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
      padding-top: 15px;
      border-top: 1px solid #231f47;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      color: #d4d4d8;
    }

    .custom-select {
      background-color: #1a1829;
      color: #ffffff;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #121026;
      border: 1px solid #3b356b;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 20px rgba(123, 115, 255, 0.3);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-title { font-size: 1.2rem; font-weight: bold; color: #ff4949; }
    .modal-body { font-size: 0.95rem; color: #d4d4d8; line-height: 1.4; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 5px; }

    .modal-btn {
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      border: none;
    }

    .modal-btn-confirm { background-color: #7b73ff; color: #fff; }
    .modal-btn-cancel { background-color: #27272a; color: #a1a1aa; }

    .version {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 0.8em;
      color: #7b73ff;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .grid-container { grid-template-columns: repeat(3, 1fr); }
      .utility-grid-container { grid-template-columns: 1fr; }
      .nav-toggle-btn { width: calc(100% - 45px); }
      .settings-icon { right: 12px; top: 16px; }
    }
  </style>
</head>

  <script>
    const tabCloakSelect = document.getElementById('tabCloakSelect');
    const aboutBlankSelect = document.getElementById('aboutBlankSelect');
    const bgSelect = document.getElementById('bgSelect');
    const riskModal = document.getElementById('riskModal');
    const viewTrack = document.getElementById('viewTrack');
    const viewToggleBtn = document.getElementById('viewToggleBtn');
    const paginationBar = document.getElementById('paginationBar');
    const p1Btn = document.getElementById('p1Btn');
    const p2Btn = document.getElementById('p2Btn');

    let currentSlide = 0; // 0: Game P1, 1: Game P2, 2: Utilities

    window.addEventListener('DOMContentLoaded', () => {
      // Load Saved Settings on Load
      const savedCloak = localStorage.getItem('selectedCloak') || 'default';
      tabCloakSelect.value = savedCloak;
      applyCloak(savedCloak);

      const savedAboutBlank = localStorage.getItem('selectedAboutBlank') || 'enabled';
      aboutBlankSelect.value = savedAboutBlank;

      const savedBg = localStorage.getItem('selectedBg') || 'default';
      bgSelect.value = savedBg;
      applyBackground(savedBg);
    });

    const cloaks = {
      default: { title: 'Art Neyton Premium', icon: 'Logo.png' },
      google: { title: 'Google', icon: 'https://www.google.com/favicon.ico' },
      drive: { title: 'Google Drive', icon: 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png' },
      classroom: { title: 'Classes', icon: 'https://ssl.gstatic.com/classroom/favicon.png' },
      clever: { title: 'Clever | Portal', icon: 'https://assets.clever.com/favicons/clever-favicon.ico' },
      canvas: { title: 'Dashboard', icon: 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico' }
    };

    const backgrounds = {
      default: 'none',
      teto: 'url("Teto.gif")',
      femboy: 'url("Femboy.png")',
      tulips: 'url("Tulips.png")',
      daisys: 'url("Daisys.png")',
      lynda: 'url("Lynda.png")'
    };

    // Smooth Slide Transition Function
    function goToPage(index) {
      currentSlide = index;
      viewTrack.style.transform = `translateX(-${index * 100}%)`;

      if (index === 2) {
        // Utilities Mode
        viewToggleBtn.textContent = 'Switch to Games';
        viewToggleBtn.style.color = '#7b73ff';
        viewToggleBtn.style.borderColor = '#7b73ff';
        paginationBar.style.display = 'none';
      } else {
        // Games Mode
        viewToggleBtn.textContent = 'Switch to Utilities';
        viewToggleBtn.style.color = '#00f2fe';
        viewToggleBtn.style.borderColor = '#00f2fe';
        paginationBar.style.display = 'flex';

        p1Btn.classList.toggle('active', index === 0);
        p2Btn.classList.toggle('active', index === 1);
      }
    }

    function toggleView() {
      if (currentSlide === 2) {
        goToPage(0); // Return to Game Page 1
      } else {
        goToPage(2); // Slide to Utilities Page
      }
    }

    // Launches site depending on about:blank setting
    function launchSite(url) {
      const mode = aboutBlankSelect.value;
      if (mode === 'enabled') {
        openAboutBlank(url);
      } else {
        window.open(url, '_blank');
      }
    }

    // about:blank popup cloaker function
    function openAboutBlank(url) {
      const win = window.open('about:blank', '_blank');
      if (win) {
        win.document.title = 'Classes'; // Cloaked tab title
        
        // Cloaked Favicon
        const link = win.document.createElement('link');
        link.rel = 'icon';
        link.href = 'https://ssl.gstatic.com/classroom/favicon.png';
        win.document.head.appendChild(link);

        // Embed site inside iframe
        const iframe = win.document.createElement('iframe');
        iframe.src = url;
        iframe.style.width = '100vw';
        iframe.style.height = '100vh';
        iframe.style.border = 'none';
        iframe.style.position = 'fixed';
        iframe.style.top = '0';
        iframe.style.left = '0';
        iframe.style.margin = '0';
        iframe.style.padding = '0';
        iframe.style.overflow = 'hidden';

        win.document.body.style.margin = '0';
        win.document.body.style.padding = '0';
        win.document.body.style.overflow = 'hidden';
        win.document.body.appendChild(iframe);
      } else {
        // Fallback if popups are blocked
        window.open(url, '_blank');
      }
    }

    function handleAboutBlankChange() {
      localStorage.setItem('selectedAboutBlank', aboutBlankSelect.value);
    }

    function applyCloak(preset) {
      const selected = preset || tabCloakSelect.value;
      const cloakData = cloaks[selected] || cloaks.default;

      document.title = cloakData.title;

      let link = document.querySelector("link[rel*='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.href = cloakData.icon;

      localStorage.setItem('selectedCloak', selected);
    }

    function handleBgChange() {
      const selected = bgSelect.value;
      if (selected === 'femboy') {
        riskModal.style.display = 'flex';
      } else {
        applyBackground(selected);
      }
    }

    function confirmRiskModal() {
      riskModal.style.display = 'none';
      applyBackground('femboy');
    }

    function cancelRiskModal() {
      riskModal.style.display = 'none';
      bgSelect.value = localStorage.getItem('selectedBg') || 'default';
    }

    function applyBackground(preset) {
      const selected = preset || bgSelect.value;
      const bgUrl = backgrounds[selected] || backgrounds.default;

      const artNeyton = document.getElementById('artNeytonContent');

      if (selected === 'default') {
        artNeyton.style.backgroundImage = 'none';
        artNeyton.style.backgroundColor = '#090814';
      } else {
        artNeyton.style.backgroundImage = bgUrl;
      }

      localStorage.setItem('selectedBg', selected);
    }

    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    }

  </script>

</body>
</html>
