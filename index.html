<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="tabTitle">Art Neyton Premium</title>
  <link id="tabFavicon" rel="icon" href="Logo.png">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #090814;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
      overflow-x: hidden;
      transition: background-image 0.3s ease;
    }

    /* Watermark Intro Animation */
    .watermark-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeOutOverlay 0.8s ease 1.8s forwards;
      pointer-events: none;
    }

    .watermark-text {
      font-size: 2.5rem;
      font-weight: bold;
      color: #7b73ff;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #7b73ff, 0 0 30px #7b73ff;
      opacity: 0;
      transform: scale(0.8);
      animation: introGlow 1.6s ease-in-out forwards;
    }

    @keyframes introGlow {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
        filter: blur(10px);
      }
      50% {
        opacity: 1;
        transform: scale(1.05) translateY(0);
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0px);
      }
    }

    @keyframes fadeOutOverlay {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Header Logo */
    .header-logo-container {
      margin-bottom: 25px;
      text-align: center;
    }

    .header-logo {
      max-width: 450px;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    /* Outer Container Card */
    .card {
      background: rgba(18, 16, 38, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #231f47;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* 5x5 Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      width: 100%;
    }

    /* Flat Solid Block Buttons */
    .launcher-btn {
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #ffffff;
      background-color: rgba(26, 24, 41, 0.9);
      border: 1px solid #2e2a4a;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 55px;
      box-sizing: border-box;
      width: 100%;
      text-align: center;
    }

    .launcher-btn img {
      max-height: 35px;
      max-width: 100%;
      object-fit: contain;
    }

    .launcher-btn:hover {
      background-color: rgba(39, 35, 61, 0.95);
      border-color: #433d6b;
    }

    .settings-icon {
      position: absolute;
      top: 15px;
      right: -55px;
      background: none;
      border: none;
      color: #71717a;
      font-size: 2.2rem;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
      padding: 5px;
      line-height: 1;
    }

    .settings-icon:hover {
      color: #7b73ff;
      transform: rotate(30deg);
    }

    .settings-panel {
      display: none;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
      padding-top: 15px;
      border-top: 1px solid #231f47;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      color: #d4d4d8;
    }

    .custom-select {
      background-color: #1a1829;
      color: #ffffff;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .custom-select:hover, .custom-select:focus {
      border-color: #7b73ff;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #27272a;
      transition: 0.3s;
      border-radius: 24px;
      border: 1px solid #3f3f46;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #a1a1aa;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #7b73ff;
      border-color: #7b73ff;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #fff;
    }

    /* Custom In-Website Modal Popup */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #121026;
      border: 1px solid #3b356b;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 20px rgba(123, 115, 255, 0.3);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4949;
    }

    .modal-body {
      font-size: 0.95rem;
      color: #d4d4d8;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 5px;
    }

    .modal-btn {
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s ease;
    }

    .modal-btn-confirm {
      background-color: #7b73ff;
      color: #fff;
    }

    .modal-btn-cancel {
      background-color: #27272a;
      color: #a1a1aa;
    }

    .modal-btn:hover {
      opacity: 0.85;
    }

    .version {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 0.8em;
      color: #7b73ff;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
      }
      .settings-icon {
        right: 15px;
        top: -45px;
      }
    }
  </style>
</head>
<body>

    <div id="settingsPanel" class="settings-panel">
      <div class="setting-item">
        <span>about:blank</span>
        <label class="switch">
          <input type="checkbox" id="aboutBlankToggle" onchange="saveSettings()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <span>Tab Cloak</span>
        <select id="tabCloakSelect" class="custom-select" onchange="applyCloak()">
          <option value="default">Default</option>
          <option value="google">Google</option>
          <option value="drive">Google Drive</option>
          <option value="classroom">Google Classroom</option>
          <option value="clever">Clever</option>
          <option value="canvas">Canvas</option>
        </select>
      </div>

      <div class="setting-item">
        <span>Background</span>
        <select id="bgSelect" class="custom-select" onchange="handleBgChange()">
          <option value="default">Default Dark</option>
          <option value="teto">Teto</option>
          <option value="femboy">Femboy</option>
          <option value="tulips">Tulips</option>
        </select>
      </div>
    </div>
  </div>

  <div class="version">V4.1.0</div>

  <script>
    const aboutBlankToggle = document.getElementById('aboutBlankToggle');
    const tabCloakSelect = document.getElementById('tabCloakSelect');
    const bgSelect = document.getElementById('bgSelect');
    const riskModal = document.getElementById('riskModal');

    const cloaks = {
      default: { title: 'Art Neyton Premium', icon: 'Logo.png' },
      google: { title: 'Google', icon: 'https://www.google.com/favicon.ico' },
      drive: { title: 'Google Drive', icon: 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png' },
      classroom: { title: 'Classes', icon: 'https://ssl.gstatic.com/classroom/favicon.png' },
      clever: { title: 'Clever | Portal', icon: 'https://assets.clever.com/favicons/clever-favicon.ico' },
      canvas: { title: 'Dashboard', icon: 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico' }
    };

    const backgrounds = {
      default: 'none',
      teto: 'url("Teto.gif")',
      femboy: 'url("Femboy.png")',
      tulips: 'url("Tulips.png")'
    };

    window.onload = function() {
      if (localStorage.getItem('aboutBlankEnabled') === 'true') {
        aboutBlankToggle.checked = true;
      }
      
      const savedCloak = localStorage.getItem('selectedCloak') || 'default';
      tabCloakSelect.value = savedCloak;
      applyCloak(savedCloak);

      const savedBg = localStorage.getItem('selectedBg') || 'default';
      bgSelect.value = savedBg;
      applyBackground(savedBg);
    };

    function saveSettings() {
      localStorage.setItem('aboutBlankEnabled', aboutBlankToggle.checked);
    }

    function applyCloak(preset) {
      const selected = preset || tabCloakSelect.value;
      const cloakData = cloaks[selected] || cloaks.default;

      document.title = cloakData.title;

      let link = document.querySelector("link[rel*='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.href = cloakData.icon;

      localStorage.setItem('selectedCloak', selected);
    }

    function handleBgChange() {
      const selected = bgSelect.value;
      if (selected === 'femboy') {
        riskModal.style.display = 'flex';
      } else {
        applyBackground(selected);
      }
    }

    function confirmRiskModal() {
      riskModal.style.display = 'none';
      applyBackground('femboy');
    }

    function cancelRiskModal() {
      riskModal.style.display = 'none';
      bgSelect.value = localStorage.getItem('selectedBg') || 'default';
    }

    function applyBackground(preset) {
      const selected = preset || bgSelect.value;
      const bgUrl = backgrounds[selected] || backgrounds.default;

      if (selected === 'default') {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#090814';
      } else {
        document.body.style.backgroundImage = bgUrl;
      }

      localStorage.setItem('selectedBg', selected);
    }

    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    }

    function openLink(url) {
      if (aboutBlankToggle.checked) {
        const win = window.open('about:blank', '_blank');
        if (win) {
          win.document.write(`
            <html>
              <head>
                <title>Clever | Portal</title>
                <link rel="icon" href="https://assets.clever.com/favicons/clever-favicon.ico">
                <style>body { margin: 0; padding: 0; overflow: hidden; background: #000; } iframe { width: 100vw; height: 100vh; border: none; }</style>
              </head>
              <body>
                <iframe src="${url}"></iframe>
              </body>
            </html>
          `);
          win.document.close();
        }
        window.location.href = 'https://clever.com';
      } else {
        window.location.href = url;
      }
    }
  </script>

</body>
</html>
